<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insights</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Insights</h1>
        <span class="status">M2 — CPU + RAM live</span>
      </header>
      <section class="grid">
        <div class="card" data-metric="cpu">
          <span class="label">CPU</span>
          <div class="gauge-slot"></div>
          <span class="sub">—</span>
        </div>
        <div class="card" data-metric="gpu">
          <span class="label">GPU</span>
          <div class="gauge-slot"></div>
          <span class="sub">M3</span>
        </div>
        <div class="card" data-metric="ram">
          <span class="label">RAM</span>
          <div class="gauge-slot"></div>
          <span class="sub">—</span>
        </div>
        <div class="card" data-metric="vram">
          <span class="label">VRAM</span>
          <div class="gauge-slot"></div>
          <span class="sub">M3</span>
        </div>
      </section>
    </main>
  </body>
</html>
