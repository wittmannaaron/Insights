<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="stylesheet" href="styles.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Insights</title>
    <script type="module" src="/main.js" defer></script>
  </head>
  <body>
    <main class="container">
      <header>
        <h1>Insights</h1>
        <span class="status">M6b — Ollama TPS via reverse proxy (port 11435)</span>
        <nav class="tabs">
          <button class="tab active" data-tab="live">Live</button>
          <button class="tab" data-tab="history">History 5 min</button>
        </nav>
      </header>

      <section class="view view-live grid">
        <div class="card" data-metric="cpu">
          <span class="label">CPU</span>
          <div class="gauge-slot"></div>
          <div class="spark-slot"></div>
          <span class="sub">—</span>
        </div>
        <div class="card" data-metric="gpu">
          <span class="label">GPU</span>
          <div class="gauge-slot"></div>
          <div class="spark-slot"></div>
          <span class="sub">—</span>
        </div>
        <div class="card" data-metric="ram">
          <span class="label">RAM</span>
          <div class="gauge-slot"></div>
          <div class="spark-slot"></div>
          <span class="sub">—</span>
        </div>
        <div class="card" data-metric="vram">
          <span class="label">VRAM</span>
          <div class="gauge-slot"></div>
          <div class="spark-slot"></div>
          <span class="sub">—</span>
        </div>
      </section>

      <section class="ollama-panel" data-reachable="unknown">
        <div class="ollama-head">
          <span class="label">Ollama</span>
          <span class="ollama-status">checking…</span>
        </div>
        <ul class="ollama-models"></ul>
        <div class="ollama-tps">
          <div class="ollama-activity-head">
            <span>Inference tokens/sec (last 30)</span>
            <span class="ollama-tps-stats">—</span>
          </div>
          <div class="ollama-tps-spark"></div>
        </div>
        <div class="ollama-activity">
          <div class="ollama-activity-head">
            <span>Recent requests (60 s)</span>
            <span class="ollama-activity-stats">—</span>
          </div>
          <div class="ollama-activity-spark"></div>
        </div>
      </section>

      <section class="view view-history" hidden>
        <div class="history-row" data-metric="cpu">
          <div class="history-head"><span class="label">CPU</span><span class="sub">—</span></div>
          <div class="history-spark"></div>
        </div>
        <div class="history-row" data-metric="gpu">
          <div class="history-head"><span class="label">GPU</span><span class="sub">—</span></div>
          <div class="history-spark"></div>
        </div>
        <div class="history-row" data-metric="ram">
          <div class="history-head"><span class="label">RAM</span><span class="sub">—</span></div>
          <div class="history-spark"></div>
        </div>
        <div class="history-row" data-metric="vram">
          <div class="history-head"><span class="label">VRAM</span><span class="sub">—</span></div>
          <div class="history-spark"></div>
        </div>
      </section>
    </main>
  </body>
</html>
